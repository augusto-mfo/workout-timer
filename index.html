<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout Timer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    @keyframes pulse-glow {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.7; }
    }

    body {
      animation: gradientShift 15s ease infinite;
      background-size: 400% 400%;
      background-image: linear-gradient(
        -45deg,
        #0f0c29,
        #302b63,
        #24243e,
        #1a1a2e,
        #0f3460,
        #16213e
      );
    }

    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1.5rem;
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 1rem;
    }

    .glass-btn {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 0.75rem;
      color: #e2e8f0;
      font-weight: 600;
      padding: 1rem 2rem;
      font-size: 1.125rem;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
    }

    .glass-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .glass-btn:active {
      transform: translateY(0);
      background: rgba(255, 255, 255, 0.12);
    }

    .glass-btn-primary {
      background: rgba(59, 130, 246, 0.3);
      border-color: rgba(59, 130, 246, 0.4);
    }

    .glass-btn-primary:hover {
      background: rgba(59, 130, 246, 0.45);
      border-color: rgba(59, 130, 246, 0.6);
    }

    .glass-btn-done {
      background: rgba(239, 68, 68, 0.3);
      border-color: rgba(239, 68, 68, 0.4);
    }

    .glass-btn-done:hover {
      background: rgba(239, 68, 68, 0.45);
      border-color: rgba(239, 68, 68, 0.6);
    }

    .glass-btn-exercise {
      background: rgba(34, 197, 94, 0.3);
      border-color: rgba(34, 197, 94, 0.4);
    }

    .glass-btn-exercise:hover {
      background: rgba(34, 197, 94, 0.45);
      border-color: rgba(34, 197, 94, 0.6);
    }

    .glass-input {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 0.75rem;
      color: #e2e8f0;
      font-size: 1.125rem;
      padding: 0.875rem 1rem;
      width: 100%;
      text-align: center;
      transition: all 0.2s ease;
    }

    .glass-input:focus {
      outline: none;
      border-color: rgba(59, 130, 246, 0.6);
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .glass-input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    .mode-btn {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 0.75rem;
      color: #94a3b8;
      font-weight: 500;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      flex: 1;
    }

    .mode-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
    }

    .mode-btn.active {
      background: rgba(59, 130, 246, 0.25);
      border-color: rgba(59, 130, 246, 0.5);
      color: #e2e8f0;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
    }

    .mode-section {
      display: none !important;
    }

    .mode-section.active {
      display: block !important;
    }

    .section-label {
      display: block;
      font-size: 0.875rem;
      color: #94a3b8;
      margin-bottom: 0.5rem;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
    }

    .timer-container {
      position: relative;
      width: 250px;
      height: 250px;
      margin: 2rem auto;
    }

    .timer-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .timer-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.1);
      stroke-width: 10;
    }

    .timer-progress {
      fill: none;
      stroke-width: 10;
      stroke-linecap: round;
      transition: stroke 0.3s;
    }

    .timer-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 4rem;
      font-weight: bold;
      color: #f1f5f9;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .title {
      font-size: 2rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 1.5rem;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
    }

    .rep-info {
      font-size: 2rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 2rem;
    }

    .exercise-info {
      font-size: 1.5rem;
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 1rem;
    }

    .exercise-label {
      font-size: 1.125rem;
      color: #94a3b8;
      margin-bottom: 0.5rem;
    }

    .final-subtitle {
      font-size: 1.125rem;
      color: #94a3b8;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .glow-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.3;
      animation: pulse-glow 8s ease-in-out infinite;
      pointer-events: none;
    }

    .glow-orb-1 {
      width: 300px;
      height: 300px;
      background: #3b82f6;
      top: -100px;
      left: -100px;
    }

    .glow-orb-2 {
      width: 400px;
      height: 400px;
      background: #8b5cf6;
      bottom: -150px;
      right: -150px;
      animation-delay: 2s;
    }

    .glow-orb-3 {
      width: 250px;
      height: 250px;
      background: #06b6d4;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: 4s;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <!-- Glow Orbs -->
  <div class="glow-orb glow-orb-1"></div>
  <div class="glow-orb glow-orb-2"></div>
  <div class="glow-orb glow-orb-3"></div>

  <div class="glass p-8 max-w-md w-full">
    <!-- Setup Screen -->
    <div id="setup-screen" class="screen active">
      <div class="title">Workout Timer</div>
      <div class="mode-selector flex gap-3 mb-6">
        <button class="mode-btn active" onclick="selectMode('reps')">Reps</button>
        <button class="mode-btn" onclick="selectMode('timed')">Timed Exercise</button>
      </div>

      <!-- Reps Mode -->
      <div id="reps-section" class="mode-section active">
        <label for="reps-input" class="section-label">Number of Reps</label>
        <input type="number" id="reps-input" min="1" value="10" class="glass-input">
        <label for="rest-input" class="section-label">Rest Between Reps (seconds)</label>
        <input type="number" id="rest-input" min="1" value="30" class="glass-input">
      </div>

      <!-- Timed Exercise Mode -->
      <div id="timed-section" class="mode-section">
        <label for="sets-input" class="section-label">Number of Sets</label>
        <input type="number" id="sets-input" min="1" value="5" class="glass-input">
        <label for="hold-input" class="section-label">Hold Time (seconds)</label>
        <input type="number" id="hold-input" min="1" value="30" class="glass-input">
        <label for="timed-rest-input" class="section-label">Rest Between Sets (seconds)</label>
        <input type="number" id="timed-rest-input" min="1" value="30" class="glass-input">
      </div>

      <div class="mt-6">
        <button class="glass-btn glass-btn-primary" onclick="startWorkout()">Start</button>
      </div>
    </div>

    <!-- Rep Screen -->
    <div id="rep-screen" class="screen">
      <div class="rep-info" id="rep-info"></div>
      <div class="btn-group">
        <button class="glass-btn glass-btn-done" onclick="doneRep()">Done</button>
        <button class="glass-btn" onclick="restart()">Back to Start</button>
      </div>
    </div>

    <!-- Exercise Timer Screen -->
    <div id="exercise-screen" class="screen">
      <div class="exercise-label" id="exercise-label"></div>
      <div class="exercise-info" id="exercise-set-info"></div>
      <div class="timer-container">
        <svg class="timer-svg" viewBox="0 0 200 200">
          <circle class="timer-bg" cx="100" cy="100" r="80"></circle>
          <circle class="timer-progress" id="exercise-timer-circle" cx="100" cy="100" r="80"></circle>
        </svg>
        <div class="timer-text" id="exercise-timer-text"></div>
      </div>
      <div class="btn-group">
        <button class="glass-btn glass-btn-exercise" id="exercise-start-btn" onclick="startExercise()">Start</button>
        <button class="glass-btn" onclick="restart()">Back to Start</button>
      </div>
    </div>

    <!-- Rest Timer Screen -->
    <div id="rest-screen" class="screen">
      <div class="title">Rest</div>
      <div class="timer-container">
        <svg class="timer-svg" viewBox="0 0 200 200">
          <circle class="timer-bg" cx="100" cy="100" r="80"></circle>
          <circle class="timer-progress" id="rest-timer-circle" cx="100" cy="100" r="80"></circle>
        </svg>
        <div class="timer-text" id="rest-timer-text"></div>
      </div>
      <div class="btn-group">
        <button class="glass-btn glass-btn-primary" onclick="skipRest()">Skip Rest</button>
      </div>
    </div>

    <!-- Final Screen -->
    <div id="final-screen" class="screen">
      <div class="title">Workout Complete!</div>
      <div class="final-subtitle text-center" id="final-summary"></div>
      <div class="btn-group">
        <button class="glass-btn" onclick="restart()">Start Over</button>
      </div>
    </div>
  </div>

  <script>
    var workoutMode = 'reps';
    var totalReps = 0;
    var totalSets = 0;
    var currentRep = 0;
    var currentSet = 0;
    var restSeconds = 0;
    var holdSeconds = 0;
    var restInterval = null;
    var exerciseInterval = null;
    var exerciseRunning = false;

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(function(s) {
        s.classList.remove('active');
      });
      document.getElementById(id).classList.add('active');
    }

    function selectMode(mode) {
      workoutMode = mode;
      document.querySelectorAll('.mode-btn').forEach(function(btn) {
        btn.classList.remove('active');
      });
      document.querySelectorAll('.mode-section').forEach(function(sec) {
        sec.classList.remove('active');
      });
      if (mode === 'reps') {
        document.querySelectorAll('.mode-btn')[0].classList.add('active');
        document.getElementById('reps-section').classList.add('active');
      } else {
        document.querySelectorAll('.mode-btn')[1].classList.add('active');
        document.getElementById('timed-section').classList.add('active');
      }
    }

    function startWorkout() {
      if (workoutMode === 'reps') {
        totalReps = parseInt(document.getElementById('reps-input').value, 10);
        restSeconds = parseInt(document.getElementById('rest-input').value, 10);

        if (!totalReps || totalReps < 1) {
          alert('Please enter a valid number of reps.');
          return;
        }
        if (!restSeconds || restSeconds < 1) {
          alert('Please enter a valid rest duration.');
          return;
        }

        currentRep = 1;
        showRepScreen();
      } else {
        totalSets = parseInt(document.getElementById('sets-input').value, 10);
        holdSeconds = parseInt(document.getElementById('hold-input').value, 10);
        restSeconds = parseInt(document.getElementById('timed-rest-input').value, 10);

        if (!totalSets || totalSets < 1) {
          alert('Please enter a valid number of sets.');
          return;
        }
        if (!holdSeconds || holdSeconds < 1) {
          alert('Please enter a valid hold time.');
          return;
        }
        if (!restSeconds || restSeconds < 1) {
          alert('Please enter a valid rest duration.');
          return;
        }

        currentSet = 1;
        showExerciseScreen();
      }
    }

    // --- Reps Mode ---

    function showRepScreen() {
      document.getElementById('rep-info').textContent =
        'Rep ' + currentRep + ' of ' + totalReps;
      showScreen('rep-screen');
    }

    function doneRep() {
      startRestTimer();
    }

    // --- Timed Exercise Mode ---

    function showExerciseScreen() {
      document.getElementById('exercise-label').textContent = 'Hold';
      document.getElementById('exercise-set-info').textContent =
        'Set ' + currentSet + ' of ' + totalSets;
      document.getElementById('exercise-timer-text').textContent = holdSeconds;
      document.getElementById('exercise-start-btn').style.display = 'block';
      exerciseRunning = false;

      var circle = document.getElementById('exercise-timer-circle');
      circle.style.strokeDasharray = '';
      circle.style.strokeDashoffset = '';
      circle.style.stroke = '';

      showScreen('exercise-screen');
    }

    function startExercise() {
      document.getElementById('exercise-start-btn').style.display = 'none';
      exerciseRunning = true;

      var remaining = holdSeconds;
      var circumference = 2 * Math.PI * 80;
      var circle = document.getElementById('exercise-timer-circle');
      circle.style.strokeDasharray = circumference;
      circle.style.strokeDashoffset = 0;
      circle.style.stroke = '#22c55e';
      document.getElementById('exercise-timer-text').textContent = remaining;

      if (exerciseInterval) clearInterval(exerciseInterval);
      exerciseInterval = setInterval(function() {
        remaining--;
        if (remaining <= 0) {
          clearInterval(exerciseInterval);
          exerciseInterval = null;
          exerciseRunning = false;
          startRestTimer();
        } else {
          var percentage = remaining / holdSeconds;
          var offset = circumference * (1 - percentage);
          circle.style.strokeDashoffset = offset;
          circle.style.stroke = getTimerColor(percentage * 100);
          document.getElementById('exercise-timer-text').textContent = remaining;
        }
      }, 1000);
    }

    // --- Rest Timer ---

    function getTimerColor(percentage) {
      var r, g, b;
      if (percentage > 66) {
        var t = (100 - percentage) / 34;
        r = Math.round(34 * (1 - t) + 255 * t);
        g = Math.round(211 * (1 - t) + 255 * t);
        b = Math.round(34);
      } else if (percentage > 33) {
        var t = (66 - percentage) / 33;
        r = Math.round(255);
        g = Math.round(255 * (1 - t) + 128 * t);
        b = Math.round(34);
      } else {
        var t = (33 - percentage) / 33;
        r = Math.round(255);
        g = Math.round(128 * (1 - t));
        b = Math.round(34);
      }
      return 'rgb(' + r + ',' + g + ',' + b + ')';
    }

    function startRestTimer() {
      var remaining = restSeconds;
      var circumference = 2 * Math.PI * 80;
      var circle = document.getElementById('rest-timer-circle');
      circle.style.strokeDasharray = circumference;
      circle.style.strokeDashoffset = 0;
      circle.style.stroke = '#22c55e';
      document.getElementById('rest-timer-text').textContent = remaining;
      showScreen('rest-screen');

      if (restInterval) clearInterval(restInterval);
      restInterval = setInterval(function() {
        remaining--;
        if (remaining <= 0) {
          clearInterval(restInterval);
          restInterval = null;
          finishRest();
        } else {
          var percentage = remaining / restSeconds;
          var offset = circumference * (1 - percentage);
          circle.style.strokeDashoffset = offset;
          circle.style.stroke = getTimerColor(percentage * 100);
          document.getElementById('rest-timer-text').textContent = remaining;
        }
      }, 1000);
    }

    function skipRest() {
      if (restInterval) {
        clearInterval(restInterval);
        restInterval = null;
      }
      finishRest();
    }

    // After the rest ends (or is skipped): go to the final screen if that
    // was the last rep/set, otherwise advance to the next one.
    function finishRest() {
      if (workoutMode === 'reps') {
        if (currentRep >= totalReps) {
          showFinalScreen();
          return;
        }
        currentRep++;
        showRepScreen();
      } else {
        if (currentSet >= totalSets) {
          showFinalScreen();
          return;
        }
        currentSet++;
        showExerciseScreen();
      }
    }

    // --- Final Screen ---

    function showFinalScreen() {
      if (workoutMode === 'reps') {
        document.getElementById('final-summary').textContent =
          'You completed ' + totalReps + ' reps with ' + restSeconds + 's rest between each.';
      } else {
        document.getElementById('final-summary').textContent =
          'You completed ' + totalSets + ' sets of ' + holdSeconds + 's holds with ' + restSeconds + 's rest between each.';
      }
      showScreen('final-screen');
    }

    function restart() {
      if (restInterval) {
        clearInterval(restInterval);
        restInterval = null;
      }
      if (exerciseInterval) {
        clearInterval(exerciseInterval);
        exerciseInterval = null;
      }
      exerciseRunning = false;
      currentRep = 0;
      currentSet = 0;
      showScreen('setup-screen');
    }
  </script>
</body>
</html>
