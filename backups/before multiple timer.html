<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout Timer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1a2e;
      color: #eee;
    }

    .container {
      text-align: center;
      padding: 2rem;
      max-width: 400px;
      width: 100%;
    }

    .title {
      font-size: 1.8rem;
      font-weight: bold;
      margin-bottom: 1.5rem;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
      color: #aaa;
    }

    input[type="number"] {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1.25rem;
      border: 1px solid #444;
      border-radius: 8px;
      background: #16213e;
      color: #eee;
      font-size: 1.1rem;
      text-align: center;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: #0f3460;
    }

    button {
      padding: 0.85rem 2rem;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary {
      background: #0f3460;
      color: #eee;
    }

    .btn-primary:hover {
      background: #1a4a8a;
    }

    .btn-done {
      background: #e94560;
      color: #fff;
      font-size: 1.3rem;
      padding: 1rem 3rem;
      width: 100%;
    }

    .btn-done:hover {
      background: #c73650;
    }

    .btn-restart {
      background: #0f3460;
      color: #eee;
      font-size: 1.1rem;
      padding: 0.85rem 2rem;
      width: 100%;
    }

    .btn-restart:hover {
      background: #1a4a8a;
    }

    .rep-buttons {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
    }

    .title {
      font-size: 1.8rem;
      font-weight: bold;
      margin-bottom: 1.5rem;
    }

    .rep-info {
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 2rem;
    }

    .rest-timer-container {
      position: relative;
      width: 250px;
      height: 250px;
      margin: 2rem auto;
    }

    .rest-timer-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .rest-timer-bg {
      fill: none;
      stroke: #2a2a4a;
      stroke-width: 10;
    }

    .rest-timer-progress {
      fill: none;
      stroke-width: 10;
      stroke-linecap: round;
      transition: stroke 0.3s;
    }

    .rest-timer-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 4rem;
      font-weight: bold;
    }

    .final-subtitle {
      font-size: 1.1rem;
      color: #aaa;
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Setup Screen -->
    <div id="setup-screen" class="screen active">
      <div class="title">Workout Timer</div>
      <label for="reps-input">Number of Reps</label>
      <input type="number" id="reps-input" min="1" value="10">
      <label for="rest-input">Rest Between Reps (seconds)</label>
      <input type="number" id="rest-input" min="1" value="30">
      <br>
      <button class="btn-primary" onclick="startWorkout()">Start</button>
    </div>

    <!-- Rep Screen -->
    <div id="rep-screen" class="screen">
      <div class="rep-info" id="rep-info"></div>
      <div class="rep-buttons">
        <button class="btn-done" onclick="doneRep()">Done</button>
        <button class="btn-restart" onclick="restart()">Back to Start</button>
      </div>
    </div>

    <!-- Rest Timer Screen -->
    <div id="rest-screen" class="screen">
      <div class="title">Rest</div>
      <div class="rest-timer-container">
        <svg class="rest-timer-svg" viewBox="0 0 200 200">
          <circle class="rest-timer-bg" cx="100" cy="100" r="80"></circle>
          <circle class="rest-timer-progress" id="rest-timer-circle" cx="100" cy="100" r="80"></circle>
        </svg>
        <div class="rest-timer-text" id="rest-timer-text"></div>
      </div>
      <button class="btn-primary" onclick="skipRest()">Skip Rest</button>
    </div>

    <!-- Final Screen -->
    <div id="final-screen" class="screen">
      <div class="title">Workout Complete!</div>
      <div class="final-subtitle" id="final-summary"></div>
      <button class="btn-restart" onclick="restart()">Start Over</button>
    </div>
  </div>

  <script>
    let totalReps = 0;
    let currentRep = 0;
    let restSeconds = 0;
    let restInterval = null;

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(function(s) {
        s.classList.remove('active');
      });
      document.getElementById(id).classList.add('active');
    }

    function startWorkout() {
      totalReps = parseInt(document.getElementById('reps-input').value, 10);
      restSeconds = parseInt(document.getElementById('rest-input').value, 10);

      if (!totalReps || totalReps < 1) {
        alert('Please enter a valid number of reps.');
        return;
      }
      if (!restSeconds || restSeconds < 1) {
        alert('Please enter a valid rest duration.');
        return;
      }

      currentRep = 1;
      showRepScreen();
    }

    function showRepScreen() {
      document.getElementById('rep-info').textContent =
        'Rep ' + currentRep + ' of ' + totalReps;
      showScreen('rep-screen');
    }

    function doneRep() {
      if (currentRep >= totalReps) {
        showFinalScreen();
        return;
      }
      startRestTimer();
    }

    function getTimerColor(percentage) {
      var r, g, b;
      if (percentage > 66) {
        var t = (100 - percentage) / 34;
        r = Math.round(34 * (1 - t) + 255 * t);
        g = Math.round(211 * (1 - t) + 255 * t);
        b = Math.round(34);
      } else if (percentage > 33) {
        var t = (66 - percentage) / 33;
        r = Math.round(255);
        g = Math.round(255 * (1 - t) + 128 * t);
        b = Math.round(34);
      } else {
        var t = (33 - percentage) / 33;
        r = Math.round(255);
        g = Math.round(128 * (1 - t));
        b = Math.round(34);
      }
      return 'rgb(' + r + ',' + g + ',' + b + ')';
    }

    function startRestTimer() {
      var remaining = restSeconds;
      var circumference = 2 * Math.PI * 80;
      var circle = document.getElementById('rest-timer-circle');
      circle.style.strokeDasharray = circumference;
      circle.style.strokeDashoffset = 0;
      circle.style.stroke = '#22c55e';
      document.getElementById('rest-timer-text').textContent = remaining;
      showScreen('rest-screen');

      if (restInterval) clearInterval(restInterval);
      restInterval = setInterval(function() {
        remaining--;
        if (remaining <= 0) {
          clearInterval(restInterval);
          restInterval = null;
          currentRep++;
          showRepScreen();
        } else {
          var percentage = remaining / restSeconds;
          var offset = circumference * (1 - percentage);
          circle.style.strokeDashoffset = offset;
          circle.style.stroke = getTimerColor(percentage * 100);
          document.getElementById('rest-timer-text').textContent = remaining;
        }
      }, 1000);
    }

    function skipRest() {
      if (restInterval) {
        clearInterval(restInterval);
        restInterval = null;
      }
      currentRep++;
      showRepScreen();
    }

    function showFinalScreen() {
      document.getElementById('final-summary').textContent =
        'You completed ' + totalReps + ' reps with ' + restSeconds + 's rest between each.';
      showScreen('final-screen');
    }

    function restart() {
      currentRep = 0;
      showScreen('setup-screen');
    }
  </script>
</body>
</html>
